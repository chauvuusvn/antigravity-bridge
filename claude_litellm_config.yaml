# Example LiteLLM config: expose the bridge to tools that expect
# Anthropic-style model names (for example Claude Code via LiteLLM).
#
# The bridge requires its real per-instance API key — placeholder keys such
# as "not-needed" are rejected. Export the key of the instance you want to
# use (from bridge/keys.json) before starting LiteLLM:
#
#   export BRIDGE_API_KEY='<key of the instance on port 8101>'
#   litellm --config claude_litellm_config.yaml
model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: http://127.0.0.1:8101/v1
      api_key: os.environ/BRIDGE_API_KEY
  - model_name: default
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: http://127.0.0.1:8101/v1
      api_key: os.environ/BRIDGE_API_KEY
